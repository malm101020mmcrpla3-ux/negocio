<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #007BFF;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        main {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a mi sitio web</h1>
    </header>

    <main>
        <h2>Acerca de esta página</h2>
        <p>Este es un ejemplo básico de cómo estructurar contenido utilizando etiquetas de HTML y un poco de diseño en CSS.</p>
        <ul>
            <li>Estructura clara</li>
            <li>Diseño adaptable</li>
            <li>Fácil de editar</li>
        </ul>
    </main>

</body>
</html>
