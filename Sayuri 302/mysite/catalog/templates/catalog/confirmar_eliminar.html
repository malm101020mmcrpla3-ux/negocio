{% extends 'catalog/base.html' %}

{% block titulo %}Eliminar Producto{% endblock %}

{% block contenido %}
<div class="card">
    <h2>⚠ Confirmar Eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar el producto <strong>"{{ producto.nombre }}"</strong>?</p>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'catalog:lista_productos' %}" class="btn btn-secondary">Cancelar</a>
        
        </div>
    </form>
</div>

<style>
    .form-actions {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }
    .btn-danger {
        background-color: #dc3545;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
    }
    .btn-danger:hover {
        background-color: #c82333;
    }
    .btn-secondary {
        background-color: #6c757d;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        font-size: 1rem;
    }
    .btn-secondary:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}
