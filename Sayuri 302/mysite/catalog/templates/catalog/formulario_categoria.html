{% extends 'catalog/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="card">
    <h2>{{ titulo }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="error">
                {% for error in field.errors %}
                <span>{{ error }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ accion }}</button>
            <a href="{% url 'catalog:lista_categorias' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<style>
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom:5px; color: #0C4B33; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px;border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
    .form-group input:focus, .form-group textarea:focus { outline: none;border-color: #0C4B33; box-shadow: 0 0 5px rgba(12, 75, 51, 0.3); }
    
    .error { color: #dc3545; font-size: 0.9rem; margin-top: 5px; }
    .form-actions { margin-top: 25px; display: flex; gap: 10px; }.btn-primary { background-color: #0C4B33; color: white; padding: 12px30px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;
}
    .btn-primary:hover { background-color: #1a7a5a; }
    .btn-secondary { background-color: #6c757d; color: white; padding: 12px 30px; border: none; border-radius: 5px; text-decoration: none; font-size: 1rem; }
    .btn-secondary:hover { background-color: #5a6268; }
</style>
{% endblock %}
